apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shoe-recommender
resources:
- namespace.yaml
- configmap.yaml
- cloudflared/configmap.yaml
- cloudflared/deployment.yaml
- backend/deployment.yaml
- backend/service.yaml
- frontend/deployment.yaml
- frontend/service.yaml
- ingress.yaml
images:
- name: ghcr.io/isaacpressman/shoe-recommender-backend
  newName: ghcr.io/isaacpressman/shoe-recommender-backend
  newTag: v1
- name: ghcr.io/isaacpressman/shoe-recommender-frontend
  newName: ghcr.io/isaacpressman/shoe-recommender-frontend
  newTag: v1
