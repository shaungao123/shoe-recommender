name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/isaacpressman
  CLUSTER: shoe-recommender
  NAMESPACE: shoe-recommender

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: IsaacPressman
          password: ${{ secrets.GHCR_PAT }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/shoe-recommender-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/shoe-recommender-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://shoes.isaacpressman.com/api
            NEXT_PUBLIC_USE_MOCK_API=false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      - run: doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER }} --expiry-seconds 600

      - name: Run migrations
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -e "s|:placeholder|:${{ github.sha }}|" \
              -e "s|name: migrate-placeholder|name: migrate-${SHORT_SHA}|" \
              k8s/backend/migrate-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete \
            job/migrate-${SHORT_SHA} -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Deploy
        run: |
          sed -i "s|newTag: .*|newTag: ${{ github.sha }}|g" k8s/kustomization.yaml
          kubectl apply -k k8s/
          kubectl rollout status deployment/backend  -n ${{ env.NAMESPACE }} --timeout=300s
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=300s
